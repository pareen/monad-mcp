# fly.toml app configuration file generated for monad-mcp on 2026-06-02T11:17:30-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'monad-mcp'
primary_region = 'iad'

[build]

[env]
  MONAD_DEFAULT_NETWORK = 'testnet'
  PORT = '8787'
  PUBLIC_BASE_URL = 'https://monad-mcp.fly.dev'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
